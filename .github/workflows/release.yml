name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos:
    name: release (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Run tests
        run: cargo test --locked

      - name: Build TenT.app and zip archive
        run: bash scripts/bundle-macos.sh --release --zip

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/TenT-*.zip dist/TenT-*.zip.sha256 --clobber
          else
            gh release create "$TAG" dist/TenT-*.zip dist/TenT-*.zip.sha256 \
              --title "TenT ${TAG}" \
              --generate-notes
          fi
